name: 종목 검색 인덱스 갱신
on:
  schedule:
    - cron: '0 21 * * 0'   # 매주 월요일 06:00 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build universe
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python3 -I stock/build_universe.py stock/universe.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock/universe.json
          git diff --cached --quiet || (git commit -m "Update stock universe" && git push)
